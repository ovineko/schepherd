allowBuilds:
  esbuild: false
audit:
  level: high
autoInstallPeers: true
blockExoticSubdeps: true
catalog:
  "@shibanet0/datamitsu-config": 0.5.0
dangerouslyAllowAllBuilds: false
dedupeDirectDeps: true
dedupePeerDependents: true
enableGlobalVirtualStore: true
enablePrePostScripts: false
engineStrict: true
hoistPattern: []
lockfile: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@datamitsu/datamitsu-darwin-arm64@0.5.1"
  - "@datamitsu/datamitsu-darwin-x64@0.5.1"
  - "@datamitsu/datamitsu-freebsd-arm64@0.5.1"
  - "@datamitsu/datamitsu-freebsd-x64@0.5.1"
  - "@datamitsu/datamitsu-linux-arm64@0.5.1"
  - "@datamitsu/datamitsu-linux-x64@0.5.1"
  - "@datamitsu/datamitsu-win32-arm64@0.5.1"
  - "@datamitsu/datamitsu-win32-x64@0.5.1"
  - "@datamitsu/datamitsu@0.5.1"
  - "@shibanet0/datamitsu-config@0.5.0"
optimisticRepeatInstall: true
overrides:
  "@shibanet0/datamitsu-config@0.5.0>fast-glob": "-"
packageExtensions:
  "@shibanet0/datamitsu-config@0.5.0":
    dependencies:
      glob: 13.0.6
      minimatch: 10.2.6
packages:
  - parsers
  - tools/ajv
  - tools/check-jsonschema
patchedDependencies:
  "@shibanet0/datamitsu-config@0.5.0": patches/@shibanet0__datamitsu-config@0.5.0.patch
preferFrozenLockfile: true
resolutionMode: lowest-direct
savePrefix: ""
strictDepBuilds: true
strictSsl: true
trustLockfile: true
trustPolicy: no-downgrade
unsafePerm: false
updateNotifier: false
verifyDepsBeforeRun: install
verifyStoreIntegrity: true
