# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser OSS configuration for the schepherd client binary.
#
# The release workflow runs the pinned GoReleaser through
# goreleaser/goreleaser-action; `task tools` installs the same version into
# .tools/bin with `go install` for local snapshots. Only OSS keys are used:
# Pro-only keys are rejected by `goreleaser check`.
#
# Versions: the client is released from SemVer tags vX.Y.Z[-prerelease] (see
# docs/versioning.md), so {{ .Version }} is X.Y.Z[-prerelease], which
# internal/buildinfo reports as is. The release workflow sets
# GORELEASER_CURRENT_TAG to the verified tag and GORELEASER_PREVIOUS_TAG to
# the previous release tag, because commits of main also carry the
# catalog-YYYYMMDD.HHMM tags of the schema catalog (git.ignore_tags keeps
# them out of local runs too). Snapshots are versioned
# 0.0.0-snapshot-<commit>, which is never a release version: such a binary
# reports "dev".
#
# Every archive carries THIRD_PARTY_LICENSES.txt, the license and notice texts
# of everything linked into the binary. The before hook refuses to build when
# it no longer matches the dependencies of any target (regenerate it with
# `go run ./tools/release licenses generate`). THIRD_PARTY_NOTICES.md is
# generated by `go run ./tools/release notices generate`, and the second hook
# refuses a stale one.
#
# Fixed owner, mode and mtime keep the archives byte-for-byte reproducible
# from the same commit; the SBOMs are not (syft names each with a random
# namespace and its creation time), so the checksum file, which lists both,
# is not either.
archives:
  - builds_info:
      group: root
      mode: 0o755
      mtime: "{{ .CommitDate }}"
      owner: root
    files:
      - info:
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"
          owner: root
        src: LICENSE
      - info:
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"
          owner: root
        src: README.md
      - info:
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"
          owner: root
        src: THIRD_PARTY_NOTICES.md
      - info:
          group: root
          mode: 0o644
          mtime: "{{ .CommitDate }}"
          owner: root
        src: THIRD_PARTY_LICENSES.txt
    format_overrides:
      - formats:
          - zip
        goos: windows
    formats:
      - tar.gz
    id: schepherd
    ids:
      - schepherd
    name_template: "schepherd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
before:
  hooks:
    - go run ./tools/release licenses check
    - go run ./tools/release notices check
builds:
  - binary: schepherd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - linux
      - darwin
      - windows
    id: schepherd
    ldflags:
      - -s -w
      - -X github.com/ovineko/schepherd/internal/buildinfo.version={{ .Version }}
      - -X github.com/ovineko/schepherd/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/ovineko/schepherd/internal/buildinfo.commitDate={{ .CommitDate }}
    main: ./cmd/schepherd
    mod_timestamp: "{{ .CommitTimestamp }}"
changelog:
  filters:
    exclude:
      - "^([0-9a-f]+ )?docs(\\([^)]+\\))?!?:"
      - "^([0-9a-f]+ )?test(\\([^)]+\\))?!?:"
      - "^([0-9a-f]+ )?ci(\\([^)]+\\))?!?:"
      - "^([0-9a-f]+ )?chore(\\([^)]+\\))?!?:"
      - Merge pull request
      - Merge branch
  groups:
    - order: 0
      regexp: "^.*?feat(\\([[:word:]]+\\))??!?:.+$"
      title: Features
    - order: 1
      regexp: "^.*?fix(\\([[:word:]]+\\))??!?:.+$"
      title: Bug Fixes
    - order: 2
      regexp: "^.*?perf(\\([[:word:]]+\\))??!?:.+$"
      title: Performance Improvements
    - order: 999
      title: Others
  sort: asc
  use: git
checksum:
  algorithm: sha256
git:
  ignore_tags:
    - "catalog-*"
# Releases only: skip_upload auto leaves the tap, the bucket and winget alone
# for a pre-release. The quarantine hook lets the unsigned, un-notarized
# binary run on macOS.
homebrew_casks:
  - binaries:
      - schepherd
    commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "chore: update {{ .ProjectName }} cask to {{ .Tag }}"
    description: Delivers pinned JSON Schemas from an OCI catalog to verified local files
    directory: Casks
    homepage: https://schepherd.ovineko.com/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/schepherd"]
          end
    ids:
      - schepherd
    name: schepherd
    repository:
      branch: main
      name: homebrew-tap
      owner: ovineko
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
project_name: schepherd
release:
  # Not a draft. GoReleaser uploads every asset into its own draft and
  # publishes the release only once it is complete; the Homebrew, Scoop and
  # winget manifests are pushed after that. The manifests' download URLs must
  # resolve the moment the registries' CIs validate them (a draft release
  # 404s and fails the winget-pkgs pull request checks), and GitHub immutable
  # releases forbid adding assets after publication, so everything must be
  # attached inside the GoReleaser run.
  draft: false
  github:
    name: schepherd
    owner: ovineko
  make_latest: "{{ if .Prerelease }}false{{ else }}true{{ end }}"
  name_template: "Schepherd {{ .Version }}"
  prerelease: auto
report_sizes: true
# An SPDX SBOM of every archive, <archive>.sbom.json, written by syft from
# PATH. It lists the Go modules linked into the binary with their licenses
# from the local module cache and the digests of the binary, and never
# contacts the network.
sboms:
  - args:
      - $artifact
      - --output
      - spdx-json=$document
    artifacts: archive
    cmd: syft
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES=true
    id: sbom
    ids:
      - schepherd
scoops:
  - commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    description: Delivers pinned JSON Schemas from an OCI catalog to verified local files.
    directory: bucket
    homepage: https://schepherd.ovineko.com
    ids:
      - schepherd
    license: MIT
    name: schepherd
    repository:
      branch: main
      name: scoop-bucket
      owner: ovineko
      token: "{{ .Env.SCOOP_TOKEN }}"
    skip_upload: auto
# A keyless cosign signature of the checksum file, which lists every archive
# and SBOM: <checksums>.sigstore.json, whose certificate names the release
# workflow at the tag.
signs:
  - args:
      - sign-blob
      - --yes
      - ${artifact}
      - --bundle=${signature}
    artifacts: checksum
    cmd: cosign
    signature: ${artifact}.sigstore.json
snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"
version: 2
winget:
  - commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"
    description: >-
      Schepherd resolves a JSON Schema from a pinned OCI catalog, verifies it by digest and size, and hands the local file to the validator you already use. It never contacts upstream schema URLs at runtime.
    homepage: https://schepherd.ovineko.com
    ids:
      - schepherd
    license: MIT
    license_url: https://github.com/ovineko/schepherd/blob/{{ .Tag }}/LICENSE
    name: schepherd
    package_identifier: ovineko.schepherd
    publisher: ovineko
    publisher_support_url: https://github.com/ovineko/schepherd/issues
    publisher_url: https://github.com/ovineko
    release_notes: "{{ .Changelog }}"
    release_notes_url: https://github.com/ovineko/schepherd/releases/tag/{{ .Tag }}
    repository:
      branch: "schepherd-{{ .Tag }}"
      name: winget-pkgs
      owner: ovineko
      pull_request:
        base:
          branch: master
          name: winget-pkgs
          owner: microsoft
        enabled: true
      token: "{{ .Env.WINGET_TOKEN }}"
    short_description: Delivers pinned JSON Schemas from an OCI catalog to verified local files.
    skip_upload: auto
    tags:
      - json-schema
      - schema
      - oci
      - cli
      - validation
