[package]
name = "schepherd-parsers"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
