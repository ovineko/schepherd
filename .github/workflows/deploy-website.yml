concurrency:
  cancel-in-progress: false
  group: pages
jobs:
  build:
    name: Build the documentation website (strict)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the repository toolchain
        run: pnpm install --frozen-lockfile
      - name: Build the site with Zensical (fails on any warning)
        run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-26.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
name: Deploy website
# Builds https://schepherd.ovineko.com from docs/ and deploys it to GitHub
# Pages on a stable release tag vX.Y.Z, never on a push to main or on a
# pre-release tag, so unreleased documentation does not go live ahead of its
# release. It runs next to release.yml, not after it. A manual run deploys the
# branch or tag it was started from; the github-pages environment therefore
# allows every ref ("No restriction"). The custom domain is set in the
# repository's Pages settings: a Pages site deployed by a workflow ignores a
# CNAME file.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}
permissions: {}
