concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}
jobs:
  ci:
    name: Mandatory checks (CI)
    needs:
      - tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish-npm:
    environment: npm
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    name: Publish npm packages
    needs:
      - release
      - tag
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: src/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/.node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Release tooling of the tagged commit
        run: go build -trimpath -o "$RUNNER_TEMP/release" ./tools/release
        working-directory: src
      # Only the tarballs the release job built, checked and recorded are
      # published, in the order of their checksum file: platform packages
      # first, @ovineko/schepherd last. publish-plan verifies them against
      # that file and skips every package the registry already has with the
      # same tarball integrity, so a re-run finishes an interrupted
      # publication; a version published with other contents fails it. A
      # release goes to the dist-tag latest, a pre-release only to next; npm
      # refuses a pre-release without --tag.
      - env:
          NPM_DIST_TAG: ${{ needs.tag.outputs.npm-dist-tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        name: Publish the recorded tarballs the registry does not have yet, platform packages first
        run: |
          case "$NPM_DIST_TAG" in
            latest | next) ;;
            *) echo "unexpected npm dist-tag '$NPM_DIST_TAG'" >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/release" packages publish-plan --kind npm --dir dist/npm \
            --checksums "dist/schepherd_${VERSION}_npm_checksums.txt" --version "$VERSION" > "$RUNNER_TEMP/npm-plan.txt"
          mapfile -t tarballs < "$RUNNER_TEMP/npm-plan.txt"
          for tarball in "${tarballs[@]}"; do
            npm publish --provenance --access public --tag "$NPM_DIST_TAG" "./dist/npm/$tarball"
          done
  publish-pypi:
    environment:
      name: pypi
      url: https://pypi.org/project/schepherd/${{ needs.tag.outputs.pypi-version }}/
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    name: Publish PyPI wheels
    needs:
      - release
      - tag
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: src/go.mod
      - name: Release tooling of the tagged commit
        run: go build -trimpath -o "$RUNNER_TEMP/release" ./tools/release
        working-directory: src
      # Exactly the wheels the release job built, checked against the
      # GoReleaser binaries and recorded in their checksum file. publish-plan
      # skips every file PyPI already has with the same SHA-256, so a re-run
      # finishes an interrupted publication without attesting a file twice,
      # and fails on a file PyPI has with other contents. The PEP 440
      # pre-releases aN, bN and rcN of a pre-release tag are never installed
      # without --pre or their exact version.
      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        id: plan
        name: Wheels PyPI does not have yet
        run: |
          "$RUNNER_TEMP/release" packages publish-plan --kind pypi --dir dist/pypi \
            --checksums "dist/schepherd_${VERSION}_pypi_checksums.txt" --version "$VERSION" > "$RUNNER_TEMP/pypi-plan.txt"
          mkdir pypi-upload
          mapfile -t wheels < "$RUNNER_TEMP/pypi-plan.txt"
          for wheel in "${wheels[@]}"; do
            cp -- "dist/pypi/$wheel" pypi-upload/
          done
          echo "wheels=${#wheels[@]}" >> "$GITHUB_OUTPUT"
      # Trusted publishing only, never a token, with a PEP 740 attestation of
      # every uploaded wheel, signed with this job's identity. Without
      # skip-existing: PyPI accepts a byte-identical file again and refuses
      # any other file of an existing name.
      - if: steps.plan.outputs.wheels != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: pypi-upload/
          skip-existing: false
  publish-rubygems:
    environment:
      name: rubygems
      url: https://rubygems.org/gems/schepherd/versions/${{ needs.tag.outputs.gem-version }}
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    name: Publish RubyGems package
    needs:
      - release
      - tag
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: src/go.mod
      - name: Release tooling of the tagged commit
        run: go build -trimpath -o "$RUNNER_TEMP/release" ./tools/release
        working-directory: src
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler: none
          working-directory: src/packaging/ruby
      # publish-plan checks the gem against its checksum file and asks
      # rubygems.org for the SHA-256 of this version: it prints the gem when
      # the version is not published, nothing when it is published with the
      # same SHA-256, so a re-run finishes an interrupted publication, and
      # fails when it is published with another one. RubyGems treats
      # X.Y.Z.rc.N as a pre-release, which gem install never picks without
      # --pre or its exact version.
      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        id: plan
        name: Gem to push (none when rubygems.org has this version with the same SHA-256)
        run: |
          gem="$("$RUNNER_TEMP/release" packages publish-plan --kind gem --dir dist/gem --checksums "dist/schepherd_${VERSION}_gem_checksums.txt" --version "$VERSION")"
          echo "gem=$gem" >> "$GITHUB_OUTPUT"
      # The Sigstore attestation of the gem that rubygems.org verifies
      # against the trusted publisher and shows with the version: signed
      # keyless with this job's identity by sigstore-cli, the signer RubyGems
      # itself uses, installed with every gem checked against the SHA-256 of
      # tools/pins/sigstore-cli/Gemfile.lock.
      - env:
          BUNDLE_FROZEN: "true"
          BUNDLE_GEMFILE: ${{ github.workspace }}/src/tools/pins/sigstore-cli/Gemfile
          BUNDLE_PATH: ${{ runner.temp }}/sigstore-cli
          GEM: ${{ steps.plan.outputs.gem }}
        if: steps.plan.outputs.gem != ''
        name: Sign the gem for its RubyGems attestation
        run: |
          bundle install
          bundle exec sigstore-cli sign "dist/gem/$GEM" --bundle "$RUNNER_TEMP/$GEM.sigstore.json"
      # Trusted publishing: the job's OIDC token becomes a short-lived API
      # key; the repository holds no RubyGems secret.
      - if: steps.plan.outputs.gem != ''
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - env:
          GEM: ${{ steps.plan.outputs.gem }}
        if: steps.plan.outputs.gem != ''
        name: Push the verified gem with its attestation
        run: gem push --attestation "$RUNNER_TEMP/$GEM.sigstore.json" "dist/gem/$GEM"
  release:
    environment:
      name: release
      url: https://github.com/ovineko/schepherd/releases/tag/${{ github.ref_name }}
    name: GitHub release, Homebrew, Scoop and winget (GoReleaser)
    needs:
      - ci
      - tag
    outputs:
      published: ${{ steps.published.outputs.published }}
    permissions:
      attestations: write # build provenance of every release file and package
      contents: write # the GitHub release
      id-token: write # keyless Sigstore certificates for the signature and attestations
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.19"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler: none
          working-directory: packaging/ruby
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The binaries of exactly the tag, from which the npm packages, wheels
      # and the gem are built and verified before anything is published.
      - env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        name: Binaries of every target (nothing is published)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: build --clean
          distribution: goreleaser
          version: v2.18.2
      # The packages are built here, once, with npm pack, uv build (the
      # hatchling of packaging/python/build-constraints.txt) and gem build
      # (the Ruby of packaging/ruby/.ruby-version); each must hold exactly its
      # staged files, its checksum file records it, and the packages of this
      # runner are installed offline and must run exactly like the binary.
      # The publishing jobs publish these files as they are.
      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        name: npm packages, PyPI wheels and the gem, checked, installed and their checksums
        run: |
          go run ./tools/release packages build --dist dist --version "$VERSION" --out "$RUNNER_TEMP/packages" --smoke
          (cd dist && sha256sum -- schepherd_*/schepherd*) > "$RUNNER_TEMP/binaries.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: ${{ runner.temp }}/packages/
          retention-days: 30
      # Archives, an SBOM of each, the checksum file of both and its keyless
      # cosign signature, uploaded to a draft that GoReleaser publishes only
      # once complete; then, for a release only, the Homebrew cask, the Scoop
      # manifest and the winget pull request. GORELEASER_PREVIOUS_TAG keeps
      # the catalog-YYYYMMDD.HHMM tags on commits of main out of the
      # changelog, which becomes the release notes.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous-tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        name: Publish the GitHub release, Homebrew cask, Scoop manifest and winget pull request
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
          distribution: goreleaser
          version: v2.18.2
      # The registries follow the published GitHub release, not the package
      # managers: npm, PyPI and RubyGems get the packages even when a
      # Homebrew, Scoop or winget push failed after the release was
      # published, or when a re-run finds the release already published (it
      # is immutable, so GoReleaser fails at its release step). The release
      # build must have reproduced the binaries the packages carry.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        id: published
        if: ${{ !cancelled() }}
        name: The GitHub release is published with the binaries of the packages
        run: |
          (cd dist && sha256sum --strict -c "$RUNNER_TEMP/binaries.sha256")
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          echo "published=true" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.published.outputs.published == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/*_checksums.txt
            ${{ runner.temp }}/packages/npm/*.tgz
            ${{ runner.temp }}/packages/pypi/*.whl
            ${{ runner.temp }}/packages/gem/*.gem
            ${{ runner.temp }}/packages/*_checksums.txt
  tag:
    name: Validate SemVer tag
    outputs:
      gem-version: ${{ steps.version.outputs.gem-version }}
      npm-dist-tag: ${{ steps.version.outputs.npm-dist-tag }}
      previous-tag: ${{ steps.version.outputs.previous-tag }}
      pypi-version: ${{ steps.version.outputs.pypi-version }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # Every v* tag is needed to check that the tag is newer than every
      # earlier release and to find the previous one, and origin/main to
      # check that the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod
      - env:
          TAG: ${{ github.ref_name }}
        id: version
        run: |
          info="$(go run ./tools/release version verify-tag --json --base origin/main "$TAG")"
          {
            echo "version=$(jq -r .version <<< "$info")"
            echo "npm-dist-tag=$(jq -r .npmDistTag <<< "$info")"
            echo "pypi-version=$(jq -r .pypiVersion <<< "$info")"
            echo "gem-version=$(jq -r .gemVersion <<< "$info")"
            echo "previous-tag=$(jq -r '.previousTag // ""' <<< "$info")"
          } >> "$GITHUB_OUTPUT"
name: Release
# Builds and publishes a client release from a SemVer tag vX.Y.Z or
# vX.Y.Z-<pre-release> that a maintainer pushed. The tag must carry a version
# no other tag has, be newer than every earlier release that is not a
# pre-release, and point to a commit of main whose go.mod module path serves
# its major version. A pre-release must be -alpha.N, -beta.N or -rc.N, the
# forms PyPI and RubyGems can publish in SemVer order. The catalog tags
# catalog-YYYYMMDD.HHMM of the schema catalog never start this workflow. The
# release runs only after every mandatory check of the CI workflow passed for
# the tagged commit, and the release job builds, checks and installs the npm
# packages, wheels and the gem before GoReleaser publishes anything.
#
# Every publishing job runs in its own protected environment (one required
# reviewer, deployments only from tags v*): GoReleaser publishes the GitHub
# release (release; marked latest, or a pre-release) with release notes
# generated from the commits since the previous release tag, and for a
# release also the Homebrew cask, the Scoop manifest and the winget pull
# request with the organization tokens HOMEBREW_TAP_TOKEN, SCOOP_TOKEN and
# WINGET_TOKEN; npm (npm; dist-tag latest, or next for a pre-release), PyPI
# (pypi) and RubyGems (rubygems) authenticate by trusted publishing, with no
# stored token, and a pre-release is never their default install.
#
# Signatures and attestations, made with the OIDC token of the publishing
# jobs: the checksum file of the archives and their SPDX SBOMs is signed
# keyless with cosign (<checksums>.sigstore.json, a release asset), and the
# build provenance of every archive, SBOM, checksum file, npm tarball, wheel
# and the gem is attested for `gh attestation verify`; npm publishes with
# provenance, PyPI receives a PEP 740 attestation of every wheel and
# rubygems.org a Sigstore attestation of the gem.
#
# "Re-run failed jobs" finishes an interrupted run: the npm, PyPI and
# RubyGems jobs skip what a registry already has with the same bytes and fail
# on anything published with other bytes. A GitHub release, once published,
# is immutable; a failed Homebrew, Scoop or winget push after it is finished
# by hand (docs/versioning.md).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
permissions: {}
